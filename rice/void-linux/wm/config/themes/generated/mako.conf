# Theme - Tokyo-night

font=Maple Mono NF 10
background-color=#15161eF2
text-color=#c0caf5
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#7aa2f7
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#7aa2f7FF

[urgency=low]
border-color=#3b4261
default-timeout=3000

[urgency=normal]
border-color=#7aa2f7
default-timeout=5000

[urgency=critical]
border-color=#f7768e
text-color=#FFFFFF
default-timeout=0
