
#Window Rules
windowrule=isfloating:1,width:700,height:400,appid:floatterm
windowrule=isfloating:1,width:700,height:400,appid:mpv
windowrule=animation_type_open:zoom,animation_type_close:zoom,appid:floatterm
windowrule=animation_type_open:zoom,animation_type_close:zoom,appid:mpv
windowrule=focused_opacity:0.90,unfocused_opacity:0.85,appid:kitty

# DMS 2.0 app id (1.6.3 uses com.danklinux.dms via dms/windowrules.conf)
windowrule=appid:^dev.duxlabs.shell$,isfloating:1
