bind=SUPER,Print,spawn_shell,flameshot gui
bind=NONE,Print,spawn_shell,grim ~/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Screen captured"
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" ~/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Area captured"
bind=CTRL,Print,spawn_shell,grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bind=CTRL+SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard"

bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 5
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 5
bindl=NONE,XF86MonBrightnessUp,spawn_shell,dms ipc call brightness increment 5 ""
bindl=NONE,XF86MonBrightnessDown,spawn_shell,dms ipc call brightness decrement 5 ""

# Volume / brightness via SUPER+F-keys (swayosd)
bind=SUPER+SHIFT,F1,spawn,dms ipc call audio mute
bind=SUPER+SHIFT,F2,spawn,dms ipc call audio decrement 5
bind=SUPER+SHIFT,F3,spawn,dms ipc call audio increment 5
bind=SUPER+SHIFT,F7,spawn_shell,dms ipc call brightness decrement 5 ""
bind=SUPER+SHIFT,F8,spawn_shell,dms ipc call brightness increment 5 ""
bind=SUPER+SHIFT,F10,spawn,dms ipc call audio micmute

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
bind=SUPER+CTRL,r,reload_config 

# --- Carried over from the Void/DMS setup ---
bind=SUPER+SHIFT,w,spawn,dms ipc call settings focusOrToggleWith personalization
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=ALT,Print,spawn_shell,grim -g "$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"')" - | satty --filename -

# Move / resize floating windows
bind=CTRL+SHIFT,Up,movewin,+0,-40
bind=CTRL+SHIFT,Down,movewin,+0,+40
bind=CTRL+SHIFT,Left,movewin,-40,+0
bind=CTRL+SHIFT,Right,movewin,+40,+0
bind=CTRL+ALT,Up,resizewin,+0,-40
bind=CTRL+ALT,Down,resizewin,+0,+40
bind=CTRL+ALT,Left,resizewin,-40,+0
bind=CTRL+ALT,Right,resizewin,+40,+0

# Tags 6-9
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# DMS notepad
bind=SUPER+ALT,n,spawn,dms ipc call notepad toggle
