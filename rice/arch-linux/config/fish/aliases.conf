# --- [ 1. MODERN CORE REPLACEMENTS ] ---
alias ls='eza --icons --group-directories-first'
alias ll='eza -lh --icons --group-directories-first --git'
alias la='eza -a --icons --group-directories-first'
alias lt='eza --tree --level=2 --icons'
alias cat='bat'
alias find='fd'
alias du='dust'
alias df='duf'
alias grep='rg'
alias top='btop'
alias htop='btop'
alias cd='z'
alias y='yazi'

# --- [ 2. ARCH & PACKAGE MANAGEMENT ] ---
alias pac='sudo pacman -S'
alias pacu='sudo pacman -Syu'
alias pacr='sudo pacman -Rs'
alias pacq='pacman -Si'
alias paclist='pacman -Qe'
alias pacorph='sudo pacman -Rns (pacman -Qtdq)' # Clean orphans
alias yays='yay -S'
alias yayu='yay -Sua'
alias fpk='flatpak'
alias fpklist='flatpak list'

# --- [ 3. NIX POWER TOOLS ] ---
alias ns='nix-shell -p'
alias nd='nix develop'
alias nr='nix run'
alias nc='nix-collect-garbage -d' # Cleanup old Nix versions
alias nconf='nano ~/.config/nixpkgs/home.nix'

# --- [ 4. SYSTEM & ASUS HARDWARE ] ---
alias sc='sudo systemctl'
alias jc='journalctl -xe'
alias asus-quiet='asusctl profile -n' # Cycle power profiles
alias gpu-status='nvidia-smi'
alias gpu-prime='prime-run'
alias myip='curl ifconfig.me'
alias temp='watch -n 1 vdirsyncer' # Or use sensors
alias sensor='watch -n 1 sensors'

# --- [ 5. HYPRLAND & UI ] ---
alias hconf='nano ~/.config/hypr/hyprland.conf'
alias wconf='nano ~/.config/waybar/config'
alias kconf='nano ~/.config/kitty/kitty.conf'
alias reload='hyprctl reload'
alias killway='killall waybar && waybar &'

# --- [ 6. GIT HELPERS ] ---
alias g='git'
alias gs='git status'
alias ga='git add'
alias gc='git commit -m'
alias gp='git push'
alias gl='git log --oneline --graph --all'
alias lg='lazygit'

# --- [ 7. PYTHON & DEV ] ---
alias py='python'
alias venv='python -m venv .venv && source .venv/bin/activate.fish'
alias pipi='pip install'

# --- [ 8. QOL / MISC ] ---
alias cls='clear'
alias q='exit'
alias :q='exit'
alias path='printf "%b\n" $PATH'
alias tarnow='tar -acf' # Quick compression: tarnow archive.tar.gz folder/
alias untar='tar -xvf'
alias ff='fastfetch'
alias matrix='cmatrix'

# --- [ 9. CONFIG ACCESS ] ---
alias fishconf='nano ~/.config/fish/config.fish'
alias aconf='nano ~/.config/fish/aliases.conf'

